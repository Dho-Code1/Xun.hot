<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Tài Xỉu</title>
    <style>
        body {
            background-color: #1a0b2e;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2d124f;
            border: 2px solid #b8860b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        h2 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .dice-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .dice {
            width: 50px;
            height: 50px;
            background: #fff;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .result-text {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }
        .tai { color: #ff4d4d; }
        .xiu { color: #4da6ff; }
        
        .bet-buttons {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button.btn-bet {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
        }
        .btn-tai { background-color: #cc0000; }
        .btn-xiu { background-color: #0066cc; }
        .btn-bet:hover { opacity: 0.8; }

        /* Bảng lịch sử chấm tròn */
        .history-board {
            margin-top: 20px;
            background: #1a0b2e;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
        }
        .history-title {
            font-size: 14px;
            margin-bottom: 8px;
            color: #ffd700;
        }
        .history-dots {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .dot-tai { background: #ff4d4d; color: white; }
        .dot-xiu { background: #4da6ff; color: white; }
        
        .wallet {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>LỊCH SỬ PHIÊN & TÀI XỈU</h2>
    <div class="wallet">Số dư: <span id="balance">10,000</span> VNĐ</div>
    
    <div class="stats">
        <span>Tài: <span id="count-tai">0</span></span>
        <span>Xỉu: <span id="count-xiu">0</span></span>
    </div>

    <div class="dice-box">
        <div class="dice" id="d1">?</div>
        <div class="dice" id="d2">?</div>
        <div class="dice" id="d3">?</div>
    </div>

    <div class="result-text" id="result-announcement">Hãy chọn Tài hoặc Xỉu để bắt đầu!</div>

    <div class="bet-buttons">
        <button class="btn-bet btn-tai" onclick="play('TAI')">ĐẶT TÀI</button>
        <button class="btn-bet btn-xiu" onclick="play('XIU')">ĐẶT XỈU</button>
    </div>

    <!-- Bảng lịch sử dạng chấm tròn mô phỏng -->
    <div class="history-board">
        <div class="history-title">Lịch sử kết quả gần nhất:</div>
        <div class="history-dots" id="historyDots">
            <!-- Các chấm kết quả sẽ hiện ở đây -->
        </div>
    </div>
</div>

<script>
    let balance = 10000;
    let countTai = 0;
    let countXiu = 0;
    let historyList = [];

    function play(userChoice) {
        let betAmount = 1000;
        if (balance < betAmount) {
            alert("Bạn đã hết tiền!");
            return;
        }

        balance -= betAmount;

        // Tung 3 con xúc sắc ngẫu nhiên từ 1 đến 6
        let d1 = Math.floor(Math.random() * 6) + 1;
        let d2 = Math.floor(Math.random() * 6) + 1;
        let d3 = Math.floor(Math.random() * 6) + 1;
        let total = d1 + d2 + d3;

        let outcome = (total >= 11) ? 'TAI' : 'XIU';

        // Hiển thị mặt xí ngầu
        document.getElementById('d1').innerText = d1;
        document.getElementById('d2').innerText = d2;
        document.getElementById('d3').innerText = d3;

        let announcement = document.getElementById('result-announcement');
        if (outcome === 'TAI') {
            announcement.innerHTML = `Tổng: <span class="tai">${total} điểm (TÀI)</span>`;
            countTai++;
        } else {
            announcement.innerHTML = `Tổng: <span class="xiu">${total} điểm (XỈU)</span>`;
            countXiu++;
        }

        // Kiểm tra thắng thua
        if (userChoice === outcome) {
            balance += betAmount * 2;
            announcement.innerHTML += " - <span style='color: #00ffcc;'>BẠN THẮNG!</span>";
        } else {
            announcement.innerHTML += " - <span style='color: #ff4d4d;'>BẠN THUA!</span>";
        }

        // Cập nhật giao diện
        document.getElementById('balance').innerText = balance.toLocaleString();
        document.getElementById('count-tai').innerText = countTai;
        document.getElementById('count-xiu').innerText = countXiu;

        // Lưu lịch sử và giới hạn hiển thị 15 kết quả gần nhất
        historyList.push({ type: outcome, score: total });
        if (historyList.length > 15) historyList.shift();

        renderHistory();
    }

    function renderHistory() {
        let container = document.getElementById('historyDots');
        container.innerHTML = '';
        historyList.forEach(item => {
            let dot = document.createElement('div');
            dot.className = `dot ${item.type === 'TAI' ? 'dot-tai' : 'dot-xiu'}`;
            dot.innerText = item.score;
            container.appendChild(dot);
        });
    }
</script>

</body>
</html>
