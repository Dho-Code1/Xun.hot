<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tài Xỉu Sunwin Simulator</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body {
            width: 100vw; height: 100vh; overflow: hidden; background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }
        
        #game-scaler {
            width: 1280px; height: 720px; position: absolute;
            background: radial-gradient(circle at center, #2e0815 0%, #0d0107 100%);
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 15px; border-radius: 12px;
            transform-origin: center center; overflow: hidden;
        }

        .header-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(60,20,30,0.8) 0%, rgba(20,5,10,0.8) 100%);
            padding: 8px 20px; border-radius: 30px; border: 1px solid #7a2b38;
        }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #ffd700; font-size: 18px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ffd700; background: #555; }
        .wallet { background: #000; padding: 5px 15px; border-radius: 15px; border: 1px solid #00ffcc; color: #00ffcc; }

        .main-stage { position: relative; width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; }
        
        .sunwin-board {
            width: 820px; height: 420px;
            background: linear-gradient(180deg, #4a1d24 0%, #20080d 100%);
            border: 4px solid #d4af37; border-radius: 80px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.4), inset 0 0 25px #000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; position: relative;
        }

        .board-header {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            background: #d4af37; color: #000; padding: 4px 30px; border-radius: 20px;
            font-weight: 900; font-size: 20px; border: 2px solid #fff; box-shadow: 0 4px 10px #000;
        }

        .side-btn {
            width: 240px; height: 260px; background: rgba(0,0,0,0.4);
            border: 3px solid #664422; border-radius: 30px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .side-btn.selected { border-color: #ffd700; background: rgba(212, 175, 55, 0.2); transform: scale(1.02); }
        .side-btn.winner { animation: flash 0.5s infinite alternate; }
        @keyframes flash { from { border-color: #00ffcc; box-shadow: 0 0 10px #00ffcc; } to { border-color: #ffd700; box-shadow: 0 0 30px #ffd700; } }

        .side-title { font-size: 50px; font-weight: 900; }
        .tai-color { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
        .xiu-color { color: #3399ff; text-shadow: 0 0 10px #3399ff; }
        .bet-stat { font-size: 14px; color: #aaa; margin-top: 5px; }

        /* Đĩa chứa 3 hột Xí Ngầu */
        .center-plate {
            width: 230px; height: 230px; background: radial-gradient(circle, #664411 0%, #1a1000 100%);
            border: 6px solid #d4af37; border-radius: 50%; position: relative;
            display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 20px #000;
        }
        
        /* Đồ họa 3 hột Xí Ngầu xếp Hình Tam Giác */
        .dice-triangle {
            width: 110px; height: 100px; position: relative;
            display: flex; justify-content: center;
        }
        .dice {
            width: 44px; height: 44px; background: #d90429;
            border-radius: 8px; border: 2px solid #ff758c; box-shadow: 2px 2px 6px #000;
            display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 4px; gap: 2px; position: absolute;
        }
        #d1 { top: 0; left: 33px; }
        #d2 { bottom: 0; left: 6px; }
        #d3 { bottom: 0; right: 6px; }

        .pip { background-color: #ffffff; border-radius: 50%; visibility: hidden; }
        
        .dice[data-val="1"] .pip:nth-child(5) { visibility: visible; }
        .dice[data-val="2"] .pip:nth-child(1), .dice[data-val="2"] .pip:nth-child(9) { visibility: visible; }
        .dice[data-val="3"] .pip:nth-child(1), .dice[data-val="3"] .pip:nth-child(5), .dice[data-val="3"] .pip:nth-child(9) { visibility: visible; }
        .dice[data-val="4"] .pip:nth-child(1), .dice[data-val="4"] .pip:nth-child(3), .dice[data-val="4"] .pip:nth-child(7), .dice[data-val="4"] .pip:nth-child(9) { visibility: visible; }
        .dice[data-val="5"] .pip:nth-child(1), .dice[data-val="5"] .pip:nth-child(3), .dice[data-val="5"] .pip:nth-child(5), .dice[data-val="5"] .pip:nth-child(7), .dice[data-val="5"] .pip:nth-child(9) { visibility: visible; }
        .dice[data-val="6"] .pip:nth-child(1), .dice[data-val="6"] .pip:nth-child(3), .dice[data-val="6"] .pip:nth-child(4), .dice[data-val="6"] .pip:nth-child(6), .dice[data-val="6"] .pip:nth-child(7), .dice[data-val="6"] .pip:nth-child(9) { visibility: visible; }

        .bowl {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 35% 35%, #ffd700, #886600);
            border: 4px solid #fff; border-radius: 50%; box-shadow: 0 10px 20px #000;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #fff; font-size: 16px; cursor: grab; z-index: 10;
        }

        .timer-badge {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 24px; font-weight: 900; color: #ff9900; background: #000;
            padding: 2px 20px; border-radius: 12px; border: 1px solid #ff9900;
        }

        .control-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(20,5,10,0.9); padding: 10px 20px; border-radius: 15px; border: 1px solid #552233;
        }
        .chips { display: flex; gap: 10px; }
        .chip-btn {
            padding: 8px 18px; background: linear-gradient(180deg, #882233 0%, #441111 100%);
            border: 1px solid #ffd700; border-radius: 20px; color: #ffd700;
            font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .chip-btn:active { transform: scale(0.95); }

        /* Biểu đồ Soi Cầu Đường Gấp Khúc */
        .chart-container {
            width: 320px; height: 75px; background: #0a0312; border: 1px solid #444;
            border-radius: 6px; position: relative; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }

        #portrait-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #ffd700; font-size: 20px; font-weight: bold;
            z-index: 9999; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

<div id="portrait-warning">Vui lòng xoay ngang màn hình thiết bị để chơi game!</div>

<div id="game-scaler">
    <div class="header-bar">
        <div class="user-info">
            <div class="avatar"></div>
            <span>NguoiChoi888</span>
        </div>
        <div class="wallet">Số dư: <span id="balance">200,000</span> VNĐ</div>
    </div>

    <div class="main-stage">
        <div class="sunwin-board">
            <div class="board-header">TÀI XỈU</div>
            <div class="timer-badge" id="timer">45s</div>

            <div class="side-btn" id="sideTai" onclick="selectSide('TAI')">
                <div class="side-title tai-color">TÀI</div>
                <div class="bet-stat">11 - 17</div>
                <div class="bet-stat" id="myBetTai">Cược: 0</div>
            </div>

            <div class="center-plate">
                <div class="dice-triangle">
                    <div class="dice" id="d1" data-val="1"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                    <div class="dice" id="d2" data-val="1"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                    <div class="dice" id="d3" data-val="1"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                </div>
                <div class="bowl" id="bowl" style="display: none;">KÉO NẶN BÁT</div>
            </div>

            <div class="side-btn" id="sideXiu" onclick="selectSide('XIU')">
                <div class="side-title xiu-color">XỈU</div>
                <div class="bet-stat">3 - 10</div>
                <div class="bet-stat" id="myBetXiu">Cược: 0</div>
            </div>
        </div>
    </div>

    <div class="control-bar">
        <div class="chips">
            <button class="chip-btn" onclick="addChip(10000)">+10K</button>
            <button class="chip-btn" onclick="addChip(50000)">+50K</button>
            <button class="chip-btn" onclick="addChip(100000)">+100K</button>
            <button class="chip-btn" onclick="setAllIn()">Tất tay</button>
        </div>
        <div id="status-msg" style="color: #ffd700; font-weight: bold;">Chọn cửa và đặt cược...</div>
        
        <!-- Biểu đồ đường gấp khúc -->
        <div class="chart-container">
            <canvas id="lineChart" width="320" height="75"></canvas>
        </div>
    </div>
</div>

<script>
    function resizeGame() {
        const scaler = document.getElementById('game-scaler');
        const warning = document.getElementById('portrait-warning');
        const w = window.innerWidth;
        const h = window.innerHeight;

        if (h > w) {
            warning.style.display = 'flex';
        } else {
            warning.style.display = 'none';
        }

        const scaleX = w / 1280;
        const scaleY = h / 720;
        const scale = Math.min(scaleX, scaleY);
        scaler.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeGame);
    window.addEventListener('load', resizeGame);

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());

    // Âm thanh Web Audio API với tiếng Ting Tiền
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (type === 'chip') {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'win') {
            // Tiếng "Ting Ting" ăn tiền vui tai
            let notes = [987.77, 1318.51, 1567.98]; // B5 - E6 - G6
            notes.forEach((freq, i) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.35);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.08);
                osc.stop(audioCtx.currentTime + i * 0.08 + 0.35);
            });
        } else if (type === 'lose') {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    let balance = 200000;
    let selectedSide = null;
    let betAmount = 0;
    let timeLeft = 45;
    let gameState = 'BET';
    let history = [];
    let currentTotal = 0, currentOutcome = null;

    function addChip(val) {
        if (gameState !== 'BET' || !selectedSide) return;
        if (balance >= val) {
            betAmount += val;
            balance -= val;
            updateUI();
            playSound('chip');
        }
    }
    function setAllIn() {
        if (gameState !== 'BET' || !selectedSide) return;
        betAmount += balance;
        balance = 0;
        updateUI();
        playSound('chip');
    }
    function selectSide(side) {
        if (gameState !== 'BET') return;
        selectedSide = side;
        document.getElementById('sideTai').classList.toggle('selected', side === 'TAI');
        document.getElementById('sideXiu').classList.toggle('selected', side === 'XIU');
        playSound('chip');
    }

    setInterval(() => {
        if (gameState === 'BET') {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft + 's';
            if (timeLeft <= 0) startNan();
        }
    }, 1000);

    function startNan() {
        gameState = 'NAN';
        document.getElementById('timer').innerText = 'NẶN!';
        let bowl = document.getElementById('bowl');
        bowl.style.display = 'flex';
        bowl.style.transition = 'none';
        bowl.style.transform = 'translate(0px, 0px)';
        
        let d1 = Math.floor(Math.random()*6)+1;
        let d2 = Math.floor(Math.random()*6)+1;
        let d3 = Math.floor(Math.random()*6)+1;
        currentTotal = d1 + d2 + d3;
        currentOutcome = currentTotal >= 11 ? 'TAI' : 'XIU';

        document.getElementById('d1').setAttribute('data-val', d1);
        document.getElementById('d2').setAttribute('data-val', d2);
        document.getElementById('d3').setAttribute('data-val', d3);

        initBowlDrag();
    }

    // Cơ chế Kéo nặn và THẢ TAY mới tính vứt bát
    function initBowlDrag() {
        let bowl = document.getElementById('bowl');
        let dragging = false, startX, startY, lastDX = 0, lastDY = 0;

        const onStart = e => {
            if (gameState !== 'NAN') return;
            dragging = true;
            let c = e.touches ? e.touches[0] : e;
            startX = c.clientX; startY = c.clientY;
            bowl.style.transition = 'none';
        };

        const onMove = e => {
            if (!dragging || gameState !== 'NAN') return;
            let c = e.touches ? e.touches[0] : e;
            lastDX = c.clientX - startX; 
            lastDY = c.clientY - startY;
            bowl.style.transform = `translate(${lastDX}px, ${lastDY}px)`;
        };

        const onEnd = () => {
            if (!dragging || gameState !== 'NAN') return;
            dragging = false;

            let distance = Math.sqrt(lastDX * lastDX + lastDY * lastDY);
            // BẮT BUỘC THẢ TAY KHI ĐÃ KÉO CÁCH XA > 100px MỚI TÍNH MỞ
            if (distance > 100) {
                reveal();
            } else {
                // Nếu thả tay khi chưa kéo đủ xa -> Bát trượt về đậy đĩa lại
                bowl.style.transition = 'transform 0.2s ease-out';
                bowl.style.transform = 'translate(0px, 0px)';
            }
        };

        bowl.onmousedown = onStart; window.onmousemove = onMove; window.onmouseup = onEnd;
        bowl.ontouchstart = onStart; window.ontouchmove = onMove; window.ontouchend = onEnd;
    }

    function reveal() {
        if (gameState !== 'NAN') return;
        gameState = 'RESULT';
        document.getElementById('bowl').style.display = 'none';

        let win = selectedSide === currentOutcome;
        if (win && betAmount > 0) {
            balance += betAmount * 2;
            playSound('win'); // Tiếng Ting Ting ăn tiền
            document.getElementById('status-msg').innerText = `THẮNG +${(betAmount*2).toLocaleString()} VNĐ (${currentTotal} ĐIỂM)`;
        } else if (betAmount > 0) {
            playSound('lose');
            document.getElementById('status-msg').innerText = `THUA -${betAmount.toLocaleString()} VNĐ (${currentTotal} ĐIỂM)`;
        } else {
            document.getElementById('status-msg').innerText = `KẾT QUẢ: ${currentOutcome} (${currentTotal} ĐIỂM)`;
        }

        if (currentOutcome === 'TAI') document.getElementById('sideTai').classList.add('winner');
        else document.getElementById('sideXiu').classList.add('winner');

        history.push({ type: currentOutcome, score: currentTotal });
        if (history.length > 15) history.shift();
        
        drawChart();
        updateUI();

        setTimeout(reset, 4000);
    }

    function reset() {
        gameState = 'BET'; timeLeft = 45; selectedSide = null; betAmount = 0;
        document.getElementById('sideTai').className = 'side-btn';
        document.getElementById('sideXiu').className = 'side-btn';
        document.getElementById('status-msg').innerText = 'Chọn cửa và đặt cược...';
        
        document.getElementById('d1').setAttribute('data-val', 1);
        document.getElementById('d2').setAttribute('data-val', 1);
        document.getElementById('d3').setAttribute('data-val', 1);
        
        updateUI();
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance.toLocaleString();
        document.getElementById('myBetTai').innerText = `Cược: ${selectedSide==='TAI'?betAmount.toLocaleString():0}`;
        document.getElementById('myBetXiu').innerText = `Cược: ${selectedSide==='XIU'?betAmount.toLocaleString():0}`;
    }

    // Vẽ Biểu Đồ Đường Gấp Khúc Nối Điểm Số (Ảnh 7)
    function drawChart() {
        const canvas = document.getElementById('lineChart');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Vẽ đường lưới background
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i * 18);
            ctx.lineTo(canvas.width, i * 18);
            ctx.stroke();
        }

        if (history.length < 2) return;

        const stepX = canvas.width / 14;
        const points = history.map((h, idx) => {
            let x = idx * stepX + 10;
            // Map điểm số (3 -> 18) vào chiều cao canvas (75 -> 5)
            let y = canvas.height - ((h.score - 3) / 15) * (canvas.height - 20) - 10;
            return { x, y, score: h.score, type: h.type };
        });

        // Vẽ dây nối zíc-zắc
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        points.forEach((p, idx) => {
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();

        // Vẽ các điểm nút tròn chứa điểm số
        points.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = p.type === 'TAI' ? '#000000' : '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Chữ số điểm
            ctx.fillStyle = p.type === 'TAI' ? '#ffffff' : '#000000';
            ctx.font = 'bold 9px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.score, p.x, p.y);
        });
    }

    drawChart();
</script>
</body>
</html>
