<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Xỉu - Nặn Bát Sòng Bạc</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background-color: #0c0414;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #1b0a2a;
            border: 2px solid #b8860b;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }
        h2 { color: #ffd700; margin: 5px 0 10px 0; font-size: 22px; }
        
        .top-info {
            display: flex;
            justify-content: space-between;
            background: #10041c;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 16px;
            border: 1px solid #4a1c7d;
        }
        .wallet { color: #00ffcc; font-weight: bold; }
        .timer { color: #ff9900; font-weight: bold; font-size: 18px; }

        /* Bàn Đặt Cược & Đĩa Xúc Xắc */
        .table-area {
            position: relative;
            background: radial-gradient(circle, #3a165c 0%, #170729 100%);
            border: 3px solid #b8860b;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .bet-side {
            width: 140px;
            padding: 15px 10px;
            background: rgba(0,0,0,0.4);
            border: 2px solid #555;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .bet-side.selected { border-color: #ffd700; background: rgba(184, 134, 11, 0.3); }
        .bet-side.active-winner {
            animation: blink 0.6s infinite alternate;
            border-color: #00ffcc;
        }
        @keyframes blink {
            from { box-shadow: 0 0 5px #ffd700; }
            to { box-shadow: 0 0 25px #ffd700; }
        }

        .side-title { font-size: 26px; font-weight: bold; }
        .tai-text { color: #ff4d4d; }
        .xiu-text { color: #4da6ff; }

        /* Khu vực Đĩa & Bát Nặn */
        .plate-box {
            position: relative;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #5e4823 0%, #2b1f07 100%);
            border: 4px solid #b8860b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px #000;
        }
        .dice-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            width: 90px;
            justify-content: center;
        }
        .dice {
            width: 38px;
            height: 38px;
            background: #d90429;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.5);
            border: 1px solid #ff7070;
        }

        /* Bát úp lên đĩa */
        .bowl {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 30%, #d4af37, #574209);
            border-radius: 50%;
            border: 3px solid #ffe89c;
            box-shadow: 0 8px 15px rgba(0,0,0,0.8);
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            transition: transform 0.1s ease-out;
            z-index: 10;
        }
        .bowl:active { cursor: grabbing; }

        /* Điều khiển tiền cược */
        .bet-control {
            background: #10041c;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4a1c7d;
            margin-bottom: 15px;
        }
        .bet-input-group { margin-bottom: 10px; }
        .bet-input-group input {
            padding: 8px;
            font-size: 16px;
            width: 140px;
            border-radius: 5px;
            border: 1px solid #b8860b;
            background: #000;
            color: #fff;
            text-align: right;
        }
        .quick-chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .chip {
            padding: 5px 12px;
            background: #3a165c;
            border: 1px solid #ffd700;
            color: #ffd700;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .chip:hover { background: #5e2493; }

        /* Bảng lịch sử ma trận */
        .history-board {
            background: #10041c;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4a1c7d;
            overflow-x: auto;
        }
        .history-title { font-size: 14px; margin-bottom: 8px; color: #ffd700; text-align: left; font-weight: bold; }
        .grid-container {
            display: grid;
            grid-template-rows: repeat(6, 24px);
            grid-auto-flow: column;
            gap: 4px;
            justify-content: start;
            min-width: max-content;
        }
        .dot {
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold;
        }
        .dot-tai { background: #ff4d4d; color: white; }
        .dot-xiu { background: #4da6ff; color: white; }
        .dot-empty { background: rgba(255, 255, 255, 0.05); }

        .result-status { font-size: 18px; font-weight: bold; margin: 10px 0; min-height: 25px; }
    </style>
</head>
<body>

<div class="container">
    <h2>TÀI XỈU - NẶN BÁT THỜI GIAN 45S</h2>

    <div class="top-info">
        <div>Số dư: <span id="balance" class="wallet">200,000</span> VNĐ</div>
        <div>Đếm ngược: <span id="timer" class="timer">45s</span></div>
    </div>

    <!-- Bàn chơi Tài Xỉu -->
    <div class="table-area">
        <div class="bet-side" id="sideTai" onclick="selectSide('TAI')">
            <div class="side-title tai-text">TÀI</div>
            <div style="font-size: 12px; margin-top:5px;">(11 - 17)</div>
        </div>

        <div class="plate-box">
            <div class="dice-group">
                <div class="dice" id="d1">?</div>
                <div class="dice" id="d2">?</div>
                <div class="dice" id="d3">?</div>
            </div>
            <!-- Bát đậy nặn -->
            <div class="bowl" id="bowl" style="display: none;">MỜI NẶN BÁT</div>
        </div>

        <div class="bet-side" id="sideXiu" onclick="selectSide('XIU')">
            <div class="side-title xiu-text">XỈU</div>
            <div style="font-size: 12px; margin-top:5px;">(3 - 10)</div>
        </div>
    </div>

    <div class="result-status" id="announcement">Vui lòng chọn cửa và nhập tiền cược!</div>

    <!-- Khu vực nhập cược -->
    <div class="bet-control">
        <div class="bet-input-group">
            <label for="betAmount">Cược: </label>
            <input type="number" id="betAmount" value="10000" step="1000" min="1000"> VNĐ
        </div>
        <div class="quick-chips">
            <div class="chip" onclick="addChip(10000)">+10K</div>
            <div class="chip" onclick="addChip(50000)">+50K</div>
            <div class="chip" onclick="addChip(100000)">+100K</div>
            <div class="chip" onclick="setAllIn()">Tất tay</div>
        </div>
    </div>

    <!-- Bảng soi cầu ma trận -->
    <div class="history-board">
        <div class="history-title">Bảng Lịch Sử Soi Cầu (Cầu Bệt, 1-1, 2-2...):</div>
        <div class="grid-container" id="historyGrid"></div>
    </div>
</div>

<script>
    let balance = 200000;
    let selectedSide = null;
    let currentBetAmount = 0;
    let gameState = 'BETTING'; // 'BETTING', 'NAN_BAT', 'RESULT'
    let timeLeft = 45; // Đã chỉnh thời gian thành 45 giây
    let historyList = [];
    
    let currentOutcome = null;
    let currentTotal = 0;

    const maxRows = 6;
    const maxCols = 25;

    function addChip(amount) {
        let input = document.getElementById('betAmount');
        input.value = (parseInt(input.value) || 0) + amount;
    }

    function setAllIn() {
        document.getElementById('betAmount').value = balance;
    }

    function selectSide(side) {
        if (gameState !== 'BETTING') return;
        selectedSide = side;
        document.getElementById('sideTai').classList.toggle('selected', side === 'TAI');
        document.getElementById('sideXiu').classList.toggle('selected', side === 'XIU');
    }

    // Vòng lặp đếm ngược 45 giây
    setInterval(() => {
        if (gameState === 'BETTING') {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft + 's';
            if (timeLeft <= 0) {
                startNanBatPhase();
            }
        }
    }, 1000);

    // Chuyển sang giai đoạn Đậy bát & Cho nặn
    function startNanBatPhase() {
        gameState = 'NAN_BAT';
        document.getElementById('timer').innerText = 'NẶN BÁT!';

        // Trừ tiền cược nếu người chơi có chọn cửa
        let amount = parseInt(document.getElementById('betAmount').value) || 0;
        if (selectedSide && amount > 0 && amount <= balance) {
            currentBetAmount = amount;
            balance -= currentBetAmount;
            document.getElementById('balance').innerText = balance.toLocaleString();
        } else {
            currentBetAmount = 0;
        }

        // Tạo kết quả xí ngầu ngầm trước
        let d1 = Math.floor(Math.random() * 6) + 1;
        let d2 = Math.floor(Math.random() * 6) + 1;
        let d3 = Math.floor(Math.random() * 6) + 1;
        currentTotal = d1 + d2 + d3;
        currentOutcome = (currentTotal >= 11) ? 'TAI' : 'XIU';

        document.getElementById('d1').innerText = d1;
        document.getElementById('d2').innerText = d2;
        document.getElementById('d3').innerText = d3;

        // Hiện bát úp che xí ngầu lại
        let bowl = document.getElementById('bowl');
        bowl.style.display = 'flex';
        bowl.style.transform = 'translate(0px, 0px)';
        document.getElementById('announcement').innerText = "Hết thời gian! Kéo bát ra để mở kết quả!";

        initBowlDrag();
    }

    // Kéo mở bát (Tương tác nặn bát)
    function initBowlDrag() {
        let bowl = document.getElementById('bowl');
        let isDragging = false;
        let startX, startY;

        function onStart(e) {
            if (gameState !== 'NAN_BAT') return;
            isDragging = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
        }

        function onMove(e) {
            if (!isDragging) return;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let deltaX = clientX - startX;
            let deltaY = clientY - startY;

            bowl.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // Nếu kéo bát đi xa hơn 60px -> Mở bát hoàn toàn
            let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (distance > 60) {
                isDragging = false;
                openBowlFully();
            }
        }

        function onEnd() { isDragging = false; }

        bowl.onmousedown = onStart;
        window.onmousemove = onMove;
        window.onmouseup = onEnd;

        bowl.ontouchstart = onStart;
        window.ontouchmove = onMove;
        window.ontouchend = onEnd;
    }

    // Mở bát và tính kết quả thắng/thua
    function openBowlFully() {
        if (gameState !== 'NAN_BAT') return;
        gameState = 'RESULT';
        
        document.getElementById('bowl').style.display = 'none';

        // Hiệu ứng nhấp nháy cửa thắng
        if (currentOutcome === 'TAI') {
            document.getElementById('sideTai').classList.add('active-winner');
        } else {
            document.getElementById('sideXiu').classList.add('active-winner');
        }

        let ann = `Kết quả: <b class="${currentOutcome === 'TAI' ? 'tai-text' : 'xiu-text'}">${currentTotal} điểm (${currentOutcome})</b>`;

        if (currentBetAmount > 0 && selectedSide) {
            if (selectedSide === currentOutcome) {
                let winAmount = currentBetAmount * 2;
                balance += winAmount;
                ann += ` - <span style="color:#00ffcc">BẠN THẮNG +${winAmount.toLocaleString()} VNĐ</span>`;
            } else {
                ann += ` - <span style="color:#ff4d4d">BẠN THUA -${currentBetAmount.toLocaleString()} VNĐ</span>`;
            }
        }

        document.getElementById('announcement').innerHTML = ann;
        document.getElementById('balance').innerText = balance.toLocaleString();

        // Cập nhật ma trận soi cầu
        historyList.push({ type: currentOutcome, score: currentTotal });
        renderMatrixGrid();

        // 5 giây sau reset phiên mới 45 giây
        setTimeout(resetRound, 5000);
    }

    function resetRound() {
        gameState = 'BETTING';
        timeLeft = 45;
        selectedSide = null;
        currentBetAmount = 0;

        document.getElementById('timer').innerText = '45s';
        document.getElementById('sideTai').className = 'bet-side';
        document.getElementById('sideXiu').className = 'bet-side';
        document.getElementById('bowl').style.display = 'none';
        document.getElementById('announcement').innerText = "Vui lòng chọn cửa và nhập tiền cược!";

        document.getElementById('d1').innerText = '?';
        document.getElementById('d2').innerText = '?';
        document.getElementById('d3').innerText = '?';
    }

    // Vẽ ma trận lịch sử soi cầu
    function renderMatrixGrid() {
        let gridContainer = document.getElementById('historyGrid');
        gridContainer.innerHTML = '';

        let matrix = Array(maxRows).fill(null).map(() => Array(maxCols).fill(null));
        let r = 0, c = 0;

        for (let i = 0; i < historyList.length; i++) {
            let item = historyList[i];
            if (i > 0 && item.type !== historyList[i - 1].type) {
                c++; r = 0;
            } else if (r >= maxRows) {
                c++; r = 0;
            }

            if (c >= maxCols) {
                historyList.shift();
                i--;
                renderMatrixGrid();
                return;
            }

            matrix[r][c] = item;
            r++;
        }

        for (let row = 0; row < maxRows; row++) {
            for (let col = 0; col < maxCols; col++) {
                let cellData = matrix[row][col];
                let cellDiv = document.createElement('div');
                if (cellData) {
                    cellDiv.className = `dot ${cellData.type === 'TAI' ? 'dot-tai' : 'dot-xiu'}`;
                    cellDiv.innerText = cellData.score;
                } else {
                    cellDiv.className = 'dot dot-empty';
                }
                gridContainer.appendChild(cellDiv);
            }
        }
    }

    renderMatrixGrid();
</script>

</body>
</html>
