<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tài Xỉu Sunwin Simulator</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body {
            width: 100vw; height: 100vh; overflow: hidden; background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }
        
        #game-scaler {
            width: 1280px; height: 720px; position: absolute;
            background: radial-gradient(circle at center, #2e0815 0%, #0d0107 100%);
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 15px; border-radius: 12px;
            transform-origin: center center; overflow: hidden;
        }

        .header-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(60,20,30,0.8) 0%, rgba(20,5,10,0.8) 100%);
            padding: 8px 20px; border-radius: 30px; border: 1px solid #7a2b38;
        }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #ffd700; font-size: 18px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ffd700; background: #555; }
        .wallet { background: #000; padding: 5px 15px; border-radius: 15px; border: 1px solid #00ffcc; color: #00ffcc; }

        .main-stage { position: relative; width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; }
        
        .sunwin-board {
            width: 820px; height: 420px;
            background: linear-gradient(180deg, #4a1d24 0%, #20080d 100%);
            border: 4px solid #d4af37; border-radius: 80px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.4), inset 0 0 25px #000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; position: relative;
        }

        .board-header {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            background: #d4af37; color: #000; padding: 4px 30px; border-radius: 20px;
            font-weight: 900; font-size: 20px; border: 2px solid #fff; box-shadow: 0 4px 10px #000;
        }

        .side-btn {
            width: 240px; height: 260px; background: rgba(0,0,0,0.4);
            border: 3px solid #664422; border-radius: 30px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .side-btn.selected { border-color: #ffd700; background: rgba(212, 175, 55, 0.2); transform: scale(1.02); }
        .side-btn.winner { animation: flash 0.5s infinite alternate; }
        @keyframes flash { from { border-color: #00ffcc; box-shadow: 0 0 10px #00ffcc; } to { border-color: #ffd700; box-shadow: 0 0 30px #ffd700; } }

        .side-title { font-size: 50px; font-weight: 900; }
        .tai-color { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
        .xiu-color { color: #3399ff; text-shadow: 0 0 10px #3399ff; }
        .bet-stat { font-size: 14px; color: #aaa; margin-top: 5px; }

        .center-plate {
            width: 220px; height: 220px; background: radial-gradient(circle, #664411 0%, #1a1000 100%);
            border: 6px solid #d4af37; border-radius: 50%; position: relative;
            display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 20px #000;
        }
        .dices { display: flex; gap: 8px; }
        .dice {
            width: 45px; height: 45px; background: #e63946; color: #fff;
            font-size: 26px; font-weight: bold; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #ff758c; box-shadow: 2px 2px 6px #000;
        }

        .bowl {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 35% 35%, #ffd700, #886600);
            border: 4px solid #fff; border-radius: 50%; box-shadow: 0 10px 20px #000;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #fff; font-size: 16px; cursor: grab; z-index: 10;
        }

        .timer-badge {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 24px; font-weight: 900; color: #ff9900; background: #000;
            padding: 2px 20px; border-radius: 12px; border: 1px solid #ff9900;
        }

        .control-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(20,5,10,0.9); padding: 10px 20px; border-radius: 15px; border: 1px solid #552233;
        }
        .chips { display: flex; gap: 10px; }
        .chip-btn {
            padding: 8px 18px; background: linear-gradient(180deg, #882233 0%, #441111 100%);
            border: 1px solid #ffd700; border-radius: 20px; color: #ffd700;
            font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .chip-btn:active { transform: scale(0.95); }

        .history-grid {
            display: grid; grid-template-rows: repeat(6, 18px); grid-auto-flow: column;
            gap: 3px; background: #000; padding: 6px; border-radius: 8px; border: 1px solid #444;
        }
        .dot { width: 18px; height: 18px; border-radius: 50%; font-size: 9px; font-weight: bold; display: flex; justify-content: center; align-items: center; }
        .dot-tai { background: #ff3333; color: #fff; }
        .dot-xiu { background: #3399ff; color: #fff; }
        .dot-empty { background: rgba(255,255,255,0.05); }

        #portrait-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #ffd700; font-size: 20px; font-weight: bold;
            z-index: 9999; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

<div id="portrait-warning">Vui lòng xoay ngang màn hình thiết bị để chơi game!</div>

<div id="game-scaler">
    <div class="header-bar">
        <div class="user-info">
            <div class="avatar"></div>
            <span>NguoiChoi888</span>
        </div>
        <div class="wallet">Số dư: <span id="balance">200,000</span> VNĐ</div>
    </div>

    <div class="main-stage">
        <div class="sunwin-board">
            <div class="board-header">TÀI XỈU</div>
            <div class="timer-badge" id="timer">45s</div>

            <div class="side-btn" id="sideTai" onclick="selectSide('TAI')">
                <div class="side-title tai-color">TÀI</div>
                <div class="bet-stat">11 - 17</div>
                <div class="bet-stat" id="myBetTai">Cược: 0</div>
            </div>

            <div class="center-plate">
                <div class="dices">
                    <div class="dice" id="d1">?</div>
                    <div class="dice" id="d2">?</div>
                    <div class="dice" id="d3">?</div>
                </div>
                <div class="bowl" id="bowl" style="display: none;">NẶN BÁT</div>
            </div>

            <div class="side-btn" id="sideXiu" onclick="selectSide('XIU')">
                <div class="side-title xiu-color">XỈU</div>
                <div class="bet-stat">3 - 10</div>
                <div class="bet-stat" id="myBetXiu">Cược: 0</div>
            </div>
        </div>
    </div>

    <div class="control-bar">
        <div class="chips">
            <button class="chip-btn" onclick="addChip(10000)">+10K</button>
            <button class="chip-btn" onclick="addChip(50000)">+50K</button>
            <button class="chip-btn" onclick="addChip(100000)">+100K</button>
            <button class="chip-btn" onclick="setAllIn()">Tất tay</button>
        </div>
        <div id="status-msg" style="color: #ffd700; font-weight: bold;">Chọn cửa và đặt cược...</div>
        <div class="history-grid" id="historyGrid"></div>
    </div>
</div>

<script>
    // Tự động căn chỉnh Scale 100% không bị che màn hình
    function resizeGame() {
        const scaler = document.getElementById('game-scaler');
        const warning = document.getElementById('portrait-warning');
        const w = window.innerWidth;
        const h = window.innerHeight;

        if (h > w) {
            warning.style.display = 'flex';
        } else {
            warning.style.display = 'none';
        }

        const scaleX = w / 1280;
        const scaleY = h / 720;
        const scale = Math.min(scaleX, scaleY);
        scaler.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeGame);
    window.addEventListener('load', resizeGame);

    // Chống thu phóng thủ công
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());

    // Âm thanh Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'chip') {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'win') {
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'lose') {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Logic Game
    let balance = 200000;
    let selectedSide = null;
    let betAmount = 0;
    let timeLeft = 45;
    let gameState = 'BET';
    let history = [];
    let currentTotal = 0, currentOutcome = null;

    function addChip(val) {
        if (gameState !== 'BET' || !selectedSide) return;
        if (balance >= val) {
            betAmount += val;
            balance -= val;
            updateUI();
            playSound('chip');
        }
    }
    function setAllIn() {
        if (gameState !== 'BET' || !selectedSide) return;
        betAmount += balance;
        balance = 0;
        updateUI();
        playSound('chip');
    }
    function selectSide(side) {
        if (gameState !== 'BET') return;
        selectedSide = side;
        document.getElementById('sideTai').classList.toggle('selected', side === 'TAI');
        document.getElementById('sideXiu').classList.toggle('selected', side === 'XIU');
        playSound('chip');
    }

    setInterval(() => {
        if (gameState === 'BET') {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft + 's';
            if (timeLeft <= 0) startNan();
        }
    }, 1000);

    function startNan() {
        gameState = 'NAN';
        document.getElementById('timer').innerText = 'NẶN!';
        document.getElementById('bowl').style.display = 'flex';
        document.getElementById('bowl').style.transform = 'translate(0,0)';
        
        let d1 = Math.floor(Math.random()*6)+1;
        let d2 = Math.floor(Math.random()*6)+1;
        let d3 = Math.floor(Math.random()*6)+1;
        currentTotal = d1 + d2 + d3;
        currentOutcome = currentTotal >= 11 ? 'TAI' : 'XIU';

        document.getElementById('d1').innerText = d1;
        document.getElementById('d2').innerText = d2;
        document.getElementById('d3').innerText = d3;

        initBowlDrag();
    }

    function initBowlDrag() {
        let bowl = document.getElementById('bowl');
        let dragging = false, startX, startY;

        const onStart = e => {
            dragging = true;
            let c = e.touches ? e.touches[0] : e;
            startX = c.clientX; startY = c.clientY;
        };
        const onMove = e => {
            if (!dragging) return;
            let c = e.touches ? e.touches[0] : e;
            let dx = c.clientX - startX, dy = c.clientY - startY;
            bowl.style.transform = `translate(${dx}px, ${dy}px)`;
            if (Math.sqrt(dx*dx + dy*dy) > 70) { dragging = false; reveal(); }
        };
        const onEnd = () => dragging = false;

        bowl.onmousedown = onStart; window.onmousemove = onMove; window.onmouseup = onEnd;
        bowl.ontouchstart = onStart; window.ontouchmove = onMove; window.ontouchend = onEnd;
    }

    function reveal() {
        if (gameState !== 'NAN') return;
        gameState = 'RESULT';
        document.getElementById('bowl').style.display = 'none';

        let win = selectedSide === currentOutcome;
        if (win && betAmount > 0) {
            balance += betAmount * 2;
            playSound('win');
            document.getElementById('status-msg').innerText = `THẮNG +${(betAmount*2).toLocaleString()} VNĐ`;
        } else if (betAmount > 0) {
            playSound('lose');
            document.getElementById('status-msg').innerText = `THUA -${betAmount.toLocaleString()} VNĐ`;
        }

        if (currentOutcome === 'TAI') document.getElementById('sideTai').classList.add('winner');
        else document.getElementById('sideXiu').classList.add('winner');

        history.push({ type: currentOutcome, score: currentTotal });
        renderHistory();
        updateUI();

        setTimeout(reset, 4000);
    }

    function reset() {
        gameState = 'BET'; timeLeft = 45; selectedSide = null; betAmount = 0;
        document.getElementById('sideTai').className = 'side-btn';
        document.getElementById('sideXiu').className = 'side-btn';
        document.getElementById('status-msg').innerText = 'Chọn cửa và đặt cược...';
        document.getElementById('d1').innerText = '?';
        document.getElementById('d2').innerText = '?';
        document.getElementById('d3').innerText = '?';
        updateUI();
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance.toLocaleString();
        document.getElementById('myBetTai').innerText = `Cược: ${selectedSide==='TAI'?betAmount.toLocaleString():0}`;
        document.getElementById('myBetXiu').innerText = `Cược: ${selectedSide==='XIU'?betAmount.toLocaleString():0}`;
    }

    function renderHistory() {
        let grid = document.getElementById('historyGrid');
        grid.innerHTML = '';
        let mat = Array(6).fill(null).map(()=>Array(25).fill(null));
        let r = 0, c = 0;
        for (let i = 0; i < history.length; i++) {
            if (i > 0 && history[i].type !== history[i-1].type) { c++; r = 0; }
            else if (r >= 6) { c++; r = 0; }
            if (c >= 25) { history.shift(); i--; continue; }
            mat[r][c] = history[i]; r++;
        }
        for (let row = 0; row < 6; row++) {
            for (let col = 0; col < 25; col++) {
                let cell = mat[row][col];
                let div = document.createElement('div');
                div.className = cell ? `dot ${cell.type==='TAI'?'dot-tai':'dot-xiu'}` : 'dot dot-empty';
                if (cell) div.innerText = cell.score;
                grid.appendChild(div);
            }
        }
    }
    renderHistory();
</script>
</body>
</html>
